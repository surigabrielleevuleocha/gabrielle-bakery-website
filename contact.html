<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Us - Suri's Crust Bakery</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="images/suri's crust.png" type="image/x-icon">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
         rel="stylesheet">
    </head>
    <body >
        <header class="contact">
            <h3>Contact Us!<br></h3>
        </header>

        <main>
            <section class="contact-container">
                <div class="form">
                    <form class="contact-form">
                      <label for="name">Name:</label>
                      <input type="text" id="name" name="name" required>

                       <label for="email">Email:</label>
                       <input type="email" id="email" name="email" required>

                       <label for="message">Message:</label>
                       <textarea id="message" name="message" required></textarea>

                        <button type="submit" class="submit">Submit</button>
                    </form>
                </div>
                

                <div class="contact-info">
                <div class="contact-info-grid">
                    <div>
                        <a href="tel:+2349065630978">
                        <i class="bi bi-telephone-fill"></i>
                        <h5>Phone</h5>
                        <p>09065630978</p>
                        </a>
                    </div>

                    <div>
                     <a href="https://wa.me/2349065630978" target="_blank">
                     <i class="bi bi-whatsapp"></i>
                    <h5>WhatsApp</h5>
                    <p>+2349065630978</p>
                    </a>

                    </div>
                    <div>
                       <a href="mailto:evuleochagabriella@gmail.com?subject=Customer Inquiry">
                       <i class="bi bi-envelope-fill"></i>
                       <h5>Email</h5>
                       <p>evuleochagabriella@gmail.com</p>
                    </a>

                    </div>
                    <div>
                        <i class="bi bi-shop-window"></i>
                        <h5>Our Store</h5>
                        <p>123 Bakery St, Sweet City, Country</p>
                    </div>

                </div></section>

            
        </main>

        <footer class="footer">
         <p>© 2026 Gabrielle Chinonyerem Evuleocha. All rights reserved.</p>
        </footer>

    </body>
</html>
